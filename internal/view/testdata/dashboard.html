<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>UpNext</title>
<style>/* UpNext — landscape 1920x480 panel. Ported from the pi-dashboard reference.
 *
 * Three engine constraints shape this file; each was verified by rasterizing
 * through omnidoc rather than assumed:
 *
 *  1. Every font-family MUST end in a generic fallback (sans-serif/monospace).
 *     Without one the text does not fall back -- it renders nothing at all.
 *  2. color-mix() is unsupported and drops the whole declaration, so the
 *     reference's color-mix(in srgb, X N%, transparent) is written as
 *     rgba(...). Verified identical output: both give rgb(23,40,61) for the
 *     24%-blue card wash.
 *  3. Fonts arrive via @font-face url() served from the embedded asset FS.
 *     Installing them on the board does not work -- see view.FontLoader.
 */

@font-face { font-family: 'Roboto'; font-weight: 400;
  src: url('fonts/Roboto.ttf') format('truetype'); }
@font-face { font-family: 'Roboto'; font-weight: 500;
  src: url('fonts/Roboto-Medium.ttf') format('truetype'); }
@font-face { font-family: 'Roboto'; font-weight: 700;
  src: url('fonts/Roboto-Bold.ttf') format('truetype'); }
@font-face { font-family: 'Roboto'; font-weight: 900;
  src: url('fonts/Roboto-Black.ttf') format('truetype'); }

:root {
  --bg:         #07080d;
  --bg-panel:   #0c0e16;
  --border:     rgba(255,255,255,0.055);
  /* A hairline that survives this panel: see #wx-widget. */
  --rule:       rgba(255,255,255,0.16);
  --text:       #dde3ef;
  --text-dim:   #3d4a62;
  --text-mid:   #6b7a96;
  /* The next-up block's lines: 6.45:1 on --bg, vs 4.62 for --text-mid.
     See .nb-next -- 18px text needs 4.5:1 and --text-mid clears it by 0.12. */
  --nb-next-fg: #8593ad;
  --amber:      #f59e0b;
  --blue:       #4a90d9;
  --green:      #6ad28a;
  --now-cursor: #f59e0b;
  --wx-curve:   #7ec8f0;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  width: 1920px; height: 480px;
  background: var(--bg); color: var(--text);
  font-family: 'Roboto', sans-serif;
  overflow: hidden;
}

/* A warm glow so the panel's edges do not read as a hard cut to black. The
   reference stylesheet has no vignette -- it was read off a screenshot -- so
   this stays subtle. */
#app {
  display: flex; width: 1920px; height: 480px;
  background:
    radial-gradient(70% 120% at 0% 0%, rgba(245,158,11,0.05), transparent 60%),
    radial-gradient(70% 120% at 100% 100%, rgba(245,158,11,0.04), transparent 60%),
    var(--bg);
}

/* ---- Left panel ---- */
#now-block {
  width: 380px; flex-shrink: 0; height: 480px;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
}

/* flex: 0 0 auto pins this to its content height. Without it the box grew ~51px
   past its text -- a column flex child with no flex property took a share of the
   free space instead of shrink-wrapping, which opened a gap between the clock
   and the weather that read as a layout mistake. Same for #wx-widget below. */
/* Explicit height, not shrink-wrap. A flex row here measures ~108px for 37px of
   ink: the flex line takes the font's full ascent+descent rather than the
   declared line-height, and the declared 2px bottom padding rendered as 38.
   Stating the height is the only thing that pins it, and it is safe because the
   content is one line of a known size. Measured, not guessed -- see the ink
   figures in docs/omnidoc-gaps.md #19. */
#clock-row {
  padding: 8px 18px 0;
  display: flex; justify-content: space-between; align-items: baseline;
  flex: 0 0 auto;
  height: 62px;
  line-height: 1;
}
#clock-time {
  font-family: 'Roboto', sans-serif;
  font-size: 46px; font-weight: 600; line-height: 1;
}
#clock-date {
  font-family: 'Roboto', sans-serif;
  font-size: 18px; font-weight: 600; color: var(--text-mid);
  letter-spacing: 0.04em;
}

/* Weather: icon, temp + condition, rain% */
#wx-widget {
  /* The asymmetric padding (2 top, 14 bottom) is what lifts the condition text
     off the rule below -- it was sitting directly on it, and then at 6/10 it
     cleared by only 3px, which still read as tight.

     It has to be done here, not on #wx-desc. This row is align-items: center,
     so #wx-temp-block is vertically centred: any height added inside it pushes
     the block down by half of what it adds beneath, and the gap barely moves.
     Both margin-bottom and padding-bottom on #wx-desc were tried and each left
     a 2px gap, measured. Shifting this row's own padding moves the centred
     block as a unit, which is the thing that actually works.

     The split trades directly: every 2px moved from top to bottom adds 2px to
     the gap (3px at 6/10, 5 at 4/12, 7 at 2/14, 9 at 0/16, measured). 2/14 is
     as far as it goes while keeping any top inset at all. There is room above
     -- #clock-row ends at y=62 and the temperature's ink starts at 83 -- so
     the constraint is taste, not collision.
     TestConditionTextClearsTheHairline measures the rendered gap.
     The total stays 16px so the row still fits its fixed 84px. */
  padding: 2px 18px 14px;
  display: flex; align-items: center; gap: 12px;
  /* --border (white at 0.055) composites to rgb(14,15,20) over this panel --
     7/255 above the background, which measured as invisible on the panel even
     though it is technically painted. --rule is the same hairline at a level
     the display actually resolves. */
  border-bottom: 1px solid var(--rule);
  /* See #clock-row: an explicit height is what pins a flex row here. The temp
     block governs: 44px temp + 4 + 18px desc = 66, plus 2/14 padding and the
     1px rule. The 50px icon is not the tall child. */
  flex: 0 0 auto;
  height: 84px;
  line-height: 1;
}
#wx-icon { width: 50px; height: 50px; flex-shrink: 0; }
#wx-temp-block { flex: 1; }
#wx-temp {
  font-family: 'Roboto', sans-serif;
  font-size: 44px; font-weight: 300; line-height: 1;
}
/* No bottom spacing here: the gap above the rule belongs to #wx-widget's
   padding. Adding margin-bottom or padding-bottom to this element does almost
   nothing, because the row centres its children -- see the note there. */
#wx-desc {
  font-family: 'Roboto', sans-serif;
  font-size: 18px; color: var(--text-mid);
  letter-spacing: 0.04em; text-transform: uppercase;
}
#wx-precip-col { text-align: right; }
#wx-precip-pct {
  font-family: 'Roboto', sans-serif;
  font-size: 22px; font-weight: 600; color: var(--blue); line-height: 1;
}
#wx-precip-label {
  font-family: 'Roboto', sans-serif;
  font-size: 18px; color: var(--text-dim);
  letter-spacing: 0.08em; text-transform: uppercase;
}

/* Headline: free-for / next up.
 *
 * The panel is a fixed 480px column, so whatever the clock and weather do not
 * use lands here. All of that slack goes to .nb-now, which grows to fill it and
 * centres its own content; .nb-next keeps its natural height at the bottom.
 *
 * The alternative -- distributing the slack with justify-content -- was tried
 * and is worse. `center` collapsed it into one gap above and below a single
 * clump, leaving a hole under the weather rule; `space-between` split it
 * between the two groups, which pushed them to opposite ends of the panel with
 * a chasm in the middle. Growing one owner and centring inside it keeps the
 * headline optically centred in the space it actually has, wherever the
 * next-up block ends up.
 *
 * It also removes a special case: when there is no next-up preview (ModeDone,
 * setup, loading) .nb-now simply grows further and stays centred, with no auto
 * margins needed to re-centre a lone child.
 *
 * These MUST be plain class selectors. omnidoc does not apply declarations
 * from a child-combinator selector -- `#now-content > .nb-now { ... }` parses
 * and is silently ignored (docs/omnidoc-gaps.md #17). Verified against a
 * control in the same document. Do not "tidy" these into descendant form. */
/* padding-bottom is 0 here and the 20px lives on .nb-next's margin-bottom
   instead. omnidoc does not reserve a column flex container's padding-bottom
   when sizing flex children (docs/omnidoc-gaps.md #18): padding-top is honoured,
   the bottom is not, so flex-grow hands out space that does not exist and the
   last child runs past the edge. Here that clipped "at 10:52 AM" off the bottom
   of the panel. Do not move this back into the shorthand. */
#now-content {
  flex: 1; min-height: 0; padding: 14px 20px 0;
  display: flex; flex-direction: column;
  overflow: hidden;
}
/* flex-basis 0, not auto: from a zero basis the grow factor distributes only
   the genuinely free space, rather than adding to the content height. */
.nb-now {
  flex-grow: 1; flex-shrink: 1; flex-basis: 0; min-height: 0;
  display: flex; flex-direction: column; justify-content: center;
}
/* An explicit spacer carries #now-content's bottom inset. Neither
   padding-bottom on the container nor margin-bottom on the last child is
   reserved by omnidoc when sizing column flex children (gaps #18) -- both are
   silently ignored and the last line runs off the panel. A zero-flex box with a
   height is honoured, so the inset is expressed as one. */
.nb-pad { flex: 0 0 20px; height: 20px; }
.nb-lead {
  font-family: 'Roboto', sans-serif;
  font-size: 18px; line-height: 1.2; color: var(--text-dim);
  letter-spacing: 0.14em; text-transform: uppercase;
  margin-bottom: 4px;
}
/* An event title headline: Roboto 800 with the calendar colour as a left bar.
   Two lines then an ellipsis; the box sizes itself to whichever it needs. */
.nb-title {
  font-family: 'Roboto', sans-serif;
  font-size: 26px; font-weight: 800; line-height: 1.1;
  color: var(--text); padding-left: 12px; margin-bottom: 4px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
/* ---- End of day ---- */
/* The one state with no timeline to align to, so the group centres itself.
   Ported from the reference's .nb-cheers, scaled to this panel: its mark is
   140px on a taller column, and 96px leaves room here for the message, the
   quote and a TOMORROW preview inside the same 380px. */
.nb-done {
  align-items: center; text-align: center;
}
.nb-cheers {
  width: 96px; height: 80px;
  /* Not full strength: the mark is decoration under a message, and at 100% the
     saturated amber pulled the eye off the text below it. */
  opacity: 0.85;
}
.nb-done-msg {
  font-family: 'Roboto', sans-serif;
  font-size: 19px; font-weight: 600; line-height: 1.2;
  color: var(--text-mid);
  letter-spacing: 0.05em; text-transform: uppercase;
  margin-top: 12px;
}
/* The quote is the only italic on the panel: it is a voice rather than data,
   and the slant is what says so without needing a label.
   
   The clamp is a backstop, not a design choice: the quote is shown in full and
   a typical zenquotes line is well inside it. But the panel is a fixed 480px
   column with no scroll, and an unbounded quote does not overflow the bottom
   -- it grows in place and paints over the author line, the TOMORROW preview,
   and eventually the weather widget above. Measured: intact at 180 characters,
   overlapping at 400. Six lines is the most that fits beside the mark and the
   preview, so anything beyond that ends in an ellipsis rather than on top of
   another line. */
.nb-quote {
  font-family: 'Roboto', sans-serif;
  font-size: 18px; font-weight: 400; line-height: 1.45;
  color: var(--nb-next-fg); font-style: italic;
  margin-top: 10px; padding: 0 6px;
  display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical;
  overflow: hidden;
}
.nb-quote-author {
  font-family: 'Roboto', sans-serif;
  font-size: 17px; color: var(--text-mid);
  letter-spacing: 0.06em; margin-top: 6px;
}

/* The duration headline: "22 min" free, or "in 4 min" until something starts.
   Both are the same shape deliberately -- these are the two states the panel is
   in most of the time, and swapping which line is large between them makes the
   left column feel like it is rearranging itself every few minutes.
   The colour is what separates them. */
.nb-free {
  font-family: 'Roboto', sans-serif;
  font-size: 52px; font-weight: 600; line-height: 1;
  letter-spacing: -0.02em; color: var(--green); margin-bottom: 4px;
}
/* Amber, not green: time until something starts is not time you have. */
.nb-free.urgent { color: var(--amber); }

/* The event name under an imminent countdown. Sized between .nb-title and
   .nb-countdown: it is the detail under the headline, not the headline, but it
   is still an event name and carries the calendar colour like one. */
.nb-sub-title {
  font-family: 'Roboto', sans-serif;
  font-size: 22px; font-weight: 700; line-height: 1.15;
  color: var(--text); padding-left: 12px; margin-top: 2px;
  /* One line with an ellipsis, not a 2-line clamp: the clamp box reserves both
     lines whatever the title's length, and the accent bar is drawn on this
     element's border, so a one-line title got a bar twice its height. */
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.nb-countdown {
  font-family: 'Roboto', sans-serif;
  font-size: 18px; line-height: 1.2; color: var(--text-mid);
  padding-left: 12px;
}
.nb-countdown.urgent { color: var(--amber); }
/* The next-up block recedes: the headline above it is what matters. No auto
   margin -- .nb-now grows to take the slack, so this keeps its natural height
   and sits directly beneath, separated by the 18px it asks for.
   flex-shrink: 0 so it is never the thing that gives when the column is tight:
   #now-content clips its overflow, and a squeezed .nb-next loses its last line
   ("at 10:52 AM") silently. .nb-now yields instead -- it has slack to give. */
/* The 18px separating this from the headline is a sibling spacer, not
   margin-top here. Same reason as .nb-pad: omnidoc does not reserve a column
   flex child's own margin when sizing it, so .nb-now grew into space this
   block had already claimed and the last line ("at 10:00 AM") was clipped off
   the bottom by #now-content's overflow. A zero-flex box with a height is
   honoured; a margin is not. */
/* Contrast, measured off the panel rather than computed. 18px is below the
   24px large-text threshold, so WCAG AA here is 4.5:1 against --bg #07080d:

     --text-dim  (the original)   1.65:1   fails badly -- unreadable
     --text-mid                   4.62:1   passes, by 0.12
     #8593ad     (now)            6.45:1   passes with headroom

   The opacity that used to be on this block is gone, but not for the reason
   first assumed: the engine was not applying it to the text colour at all, so
   the lead rendered at --text-mid's full 4.62 rather than the 3.61 that
   compositing 0.85 would predict. It is removed because a declaration that
   does nothing is worse than no declaration -- it invites exactly that kind of
   wrong arithmetic.

   6.45:1 against the body text's 15.54:1 keeps a clear hierarchy while leaving
   margin over the 4.5 floor. --nb-next-fg exists so these lines can move
   without touching --text-mid, which is used elsewhere where 4.62 is fine.
   TestNextUpBlockMeetsContrastAA checks each line separately -- the title is
   lighter, so a whole-block maximum reports a pass while the other two fail. */
.nb-next {
  padding-left: 12px;
  flex: 0 0 auto;
}
.nb-next-gap { flex: 0 0 18px; height: 18px; }
/* --text-mid, not --text-dim: the same lift .ad-lead needed. #3d4a62 is too
   faint for a label on this display, and here it was additionally multiplied
   by the block's opacity. */
.nb-next-lead {
  font-family: 'Roboto', sans-serif;
  font-size: 18px; line-height: 1.2; color: var(--nb-next-fg);
  letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 2px;
}
.nb-next-title {
  font-family: 'Roboto', sans-serif;
  font-size: 18px; line-height: 1.2; font-weight: 600; color: #a0aec0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.nb-next-at {
  font-family: 'Roboto', sans-serif;
  font-size: 18px; line-height: 1.2; color: var(--nb-next-fg);
  margin-top: 2px;
}

/* Setup hint replaces the headline when the board is not associated. */
.sh-lead {
  font-family: 'Roboto', sans-serif;
  font-size: 22px; color: var(--amber);
  letter-spacing: 0.14em; text-transform: uppercase;
}
.sh-step { font-size: 22px; margin-top: 8px; }
.sh-mono { color: var(--blue); }
/* The "this takes a minute" line recedes: it is reassurance, not instruction. */
.sh-wait {
  font-family: 'Roboto', sans-serif;
  font-size: 18px; color: var(--text-dim);
}

/* ---- Right zone: agenda over weather ---- */
/* overflow:hidden is load-bearing. #agenda-row is wider than this zone and is
   pre-scrolled with transform: translateX(-Npx), so once the agenda scrolls at
   all its background paints out past this zone's left edge and washes over the
   whole left panel -- clock, weather, and headline included. Nothing else
   clips it: the zone is the only ancestor between the row and <body>.

   Found on the panel, not in a test: the golden fixture's agenda happens to
   sit at offset 0, where there is nothing to overflow. Any capture taken when
   an event has scrolled off the left shows it. */
#timeline-zone {
  flex: 1; height: 480px; position: relative;
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* The NOW bar spans the agenda and the weather strip, stopping above the
   forecast row. It starts below the 40px all-day ribbon so that band can use
   the full width. */
#now-bar {
  position: absolute; top: 40px; bottom: 72px; left: 0; width: 3px;
  background: var(--now-cursor);
  box-shadow: 0 0 8px var(--amber), 0 0 22px rgba(245,158,11,0.4);
  z-index: 20;
}
/* The dot caps the cursor at the top of the band. */
#now-bar-dot {
  position: absolute; top: -4px; left: -4px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 6px var(--amber);
}
/* Vertical, as in the reference. 20px, not the reference's 13: this is read
   from across a room, and beside a 3px glowing bar a 13px label disappeared.

   text-orientation: upright keeps each letter facing the reader; the initial
   `mixed` would lay Latin on its side, which is correct for CJK and wrong for
   a three-letter English label.

   The stated width is load-bearing, not decoration. A shrink-to-fit box in a
   vertical writing-mode is still sized on the horizontal axis, so an auto
   width comes out as wide as the text is long -- measured 51px against 18px
   of ink, and the engine logs it.

   20px is the em square at this font-size, so no glyph overflows the box; at
   the 16px it was, W was wider than its box while O was much narrower, and
   without text-align each letter sat against the block start -- which is what
   made the three-letter stack read as ragged. text-align centres each glyph on
   the inline axis, which is the horizontal one in this writing-mode. left is
   7px rather than 9 so the wider box stays centred on the same axis. */
/* One block per letter, NOT writing-mode.

   text-align does not apply to glyphs in this engine's vertical writing-mode:
   they are placed on the block axis by advance width, so N and O (8px of ink)
   sat 2px left of W (12px) and the stack read as ragged. Probed four ways --
   with and without a stated width, and with per-letter spans each carrying
   their own text-align -- and all four measured the same 2.5px spread, which
   is what rules out a CSS fix.

   Stacked blocks put each letter in its own horizontal line box, where
   text-align works normally: measured spread 0.0px. The tradeoff is that the
   markup carries the layout, so the template spells out the letters.

   line-height 1.05 rather than 1: at 1 the three boxes total 60px against the
   56px the glyphs need, and the small leading keeps the stack from reading as
   cramped beside the 3px bar. */
#now-bar-label {
  position: absolute; top: 14px; left: 7px;
  width: 20px; text-align: center;
  font-family: 'Roboto', sans-serif;
  font-size: 20px; font-weight: 700; line-height: 1.05;
  color: var(--amber);
}
/* A scrim, so the label stays readable where the cursor bisects a card. The
   letters ride over whatever is behind the bar, and amber on a white title
   measures 0.60:1 -- which is what made NOW unreadable whenever it crossed one.

   Per LETTER, not on #now-bar-label. The three letters are separate blocks (see
   the note above) laid out down a 20px strip with leading between them, so a
   background on the parent leaves the card showing through the gaps around each
   glyph. A background here paints the line box the glyph actually sits in.

   Translucent, and 3px wider each side. Fully opaque reads as three black slabs
   laid on the timeline; the alpha lets the card's own texture through so the
   tiles sit in the design rather than on it. 0.72 is as light as it goes while
   the letters still hold over a title -- compared against 1.0, 0.85 and 0.6 in
   the full panel render, and at 0.6 the title behind reads through the glyphs.
   The glyphs slightly exceed their 20px box, so the negative margins are what
   keep their edges off the card.

   text-shadow is the usual way to do this and is NOT available: this engine
   parses and ignores it. Probed on white, where a black shadow cannot be
   missed -- the darkest pixel was identical with and without it, and the full
   render was byte-for-byte unchanged. Do not reach for it here.

   A descendant selector, not `#now-bar-label > div`: the child combinator
   parses and is then silently ignored here (gap 17, the same reason the agenda
   row and the stack type scale avoid it). With `>` this rule matched nothing
   and the full render came back byte-identical. */
.now-letter {
  background: rgba(7, 8, 13, 0.72);
  border-radius: 4px;
  margin: 0 -3px;
}

/* All-day pills ride above the card row, starting at the left edge. The NOW
   bar begins below this band, so the ribbon has the full width.

   A block of inline-blocks rather than a flex row. The flex version truncated
   the pill's text with an ellipsis in the full page, though an isolated probe
   of the same rules does not reproduce it -- so the cause is something about
   this document rather than the properties themselves. Nothing here needs
   flex; the items just sit in a line. */
.ad-ribbon {
  padding: 6px 18px 0 18px;
  height: 40px; flex-shrink: 0; overflow: hidden;
  white-space: nowrap;
}
/* Without this the pill reads as a stray box floating above the cards -- it is
   the only thing in the band and nothing says what it is.
   --text-mid, not --text-dim: at #3d4a62 the label was too faint to read as a
   caption, so the pill still looked unexplained. This is the same lift the
   divider rule needed; dim greys that work on a monitor disappear here. */
.ad-lead {
  display: inline-block; margin-right: 10px;
  font-family: 'Roboto', sans-serif;
  font-size: 16px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-mid);
}
/* One line, always: the ribbon is 40px and has no room for a second. Long
   titles are cut with an ellipsis. */
.ad-pill {
  display: inline-block; margin-right: 8px;
  font-family: 'Roboto', sans-serif;
  font-size: 19px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 330px; padding: 3px 12px 4px; border-radius: 4px;
}

/* Card row fills the rest of the agenda band.
   The vertical budget must sum to exactly 480 or the rows overlap (the panel
   does not scroll): ribbon 40 + agenda 240 + wx-zone 128 + forecast 72 = 480.
   wx-strip and forecast come from the reference (104 + 58); the extra 24px on
   the strip is the hour axis, which the reference overlays inside the canvas
   and this port renders as its own row. */
/* gap matches model.CardGapPx -- the agenda's arithmetic assumes exactly this
   spacing, so the two must change together.

   The background lifts the band off the surround: the reference's blue tint
   plus its vertical grain. Both are stronger than the reference's values
   (0.05 / 0.015) -- over #07080d those composite to under 1/255 and this panel
   renders them as flat black. These are the levels the display resolves. */
#agenda-row {
  background:
    radial-gradient(120% 100% at 0% 0%, rgba(74,144,217,0.16), transparent 55%),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 4px),
    #0a0d16;
  height: 240px; flex-shrink: 0;
  display: flex; align-items: stretch; gap: 14px;
  padding: 0 18px;
}

/* The row's inset lives on its children, NOT as padding on the row.
   
   A flex row here offsets a stretched child by padding-top and then sizes it to
   the container's full height, so the child overshoots the bottom by
   padding-top + padding-bottom: measured 10..249 inside a 240px row declared
   with padding 10/12, against the 10..227 it should occupy. The card's 1px
   bottom border was drawn 22px below the band and clipped away, so the cards
   read as open-bottomed boxes.
   
   Same family as gap 18, which documents the column case and is worked around
   with .nb-pad -- but not the same fix: a spacer element cannot inset a row's
   children on the block axis. Stating the row's height as content-box (218)
   also renders correctly but shrinks its flow height to 218, which breaks the
   480 budget below it. Margins keep the row at 240 and the child at 10..227,
   verified both ways.
   
   Written as plain class selectors, not `#agenda-row > *`: a child combinator
   parses and is then silently ignored on this engine (gap 17), so the rule
   would apply to nothing and the cards would sit flush against the band edge
   with no error anywhere.
   
   The horizontal inset stays on the row -- only the block axis is affected --
   so CardPadPx keeps its meaning and the agenda's x arithmetic is unchanged.
   The values stay pinned to the model by TestStylesheetMatchesModelGeometry.

   .evt-stack takes the same inset from here, but it needs one more thing to
   make it stick -- see the note on that rule. Its rows zero the margin again,
   since the wrapper already carries it for all of them. */
.evt, .gap, .day-sep, .evt-stack, .agenda-empty {
  margin-top: 10px; margin-bottom: 12px;
}

/* ---- Event card ---- */
.evt {
  width: 196px; flex-shrink: 0;
  position: relative; /* the badge pins to this box */
  display: flex; flex-direction: column;
  justify-content: center;
  padding: 14px 18px;
  border-radius: 10px;
  background: linear-gradient(160deg, rgba(255,255,255,0.045), rgba(255,255,255,0.018));
  border: 1px solid var(--border);
  border-top: 3px solid rgba(74,144,217,0.8);
  overflow: hidden;
}
/* Up to two lines, then an ellipsis. */
.evt-title {
  font-family: 'Roboto', sans-serif;
  font-size: 25px; font-weight: 700; line-height: 1.1;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.evt-time {
  font-family: 'Roboto', sans-serif;
  font-size: 21px; font-weight: 600; line-height: 1.4;
  color: rgba(221,227,239,0.8);
}
.evt-meta {
  font-family: 'Roboto', sans-serif;
  font-size: 16px; font-weight: 500; line-height: 1.4;
  letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-mid);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Past events recede. */
.evt.past {
  background: rgba(255,255,255,0.012);
  border-top-color: rgba(255,255,255,0.06);
  opacity: 0.4;
}
.evt.past .evt-title { color: var(--text-mid); font-weight: 500; }
.evt.past .evt-time { color: var(--text-mid); font-weight: 400; }

/* The in-progress card is the one the NOW bar crosses. */
.evt.current {
  background: linear-gradient(160deg, rgba(74,144,217,0.24), rgba(74,144,217,0.07));
  border-color: rgba(74,144,217,0.55);
  box-shadow: 0 0 0 1px rgba(74,144,217,0.35);
}
.evt.current .evt-title { font-size: 27px; }

/* Starting within 30 minutes. */
.evt.soon {
  border-top-color: var(--amber);
  box-shadow: 0 0 0 1px rgba(245,158,11,0.3);
}

/* A tentative/unaccepted invite: hatched so it reads as "not yours yet". */
.evt.ghost {
  opacity: 0.5;
  border-style: dashed;
  background:
    repeating-linear-gradient(-45deg,
      rgba(255,255,255,0.06) 0 5px, transparent 5px 11px);
}

/* A tab flush to the card's right border: square right corners, rounded left,
   breaking out of the card's 18px right padding. */
.evt-badge {
  position: absolute; right: -18px; bottom: 14px;
  font-family: 'Roboto', sans-serif;
  font-size: 14px; font-weight: 700; white-space: nowrap;
  letter-spacing: 0.04em; text-transform: uppercase;
  padding: 3px 10px 4px; border-radius: 999px 0 0 999px;
}
.evt-badge.live { color: #07080d; background: var(--blue); }
.evt-badge.soon {
  color: var(--amber); border: 1px solid var(--amber); border-right: 0;
  padding-right: 11px;
}

/* ---- Current slot: in-progress events stacked vertically, sized to their
   duration span so the single NOW bar bisects the whole stack. ---- */
/* Height is stated, not stretched. A stretched child is offset by the row's
   inset and THEN sized to the row's full height -- the same engine behaviour the
   margin rule above documents for .evt -- so the stack ran from 40 to ~291
   against a band ending at 280, and its last row was drawn over the weather
   chart. .evt does not hit this because its own height is content-driven; the
   stack's rows divide whatever height the wrapper reports, so an overshoot here
   is distributed into every row rather than clipped off one border.

   218 is the band minus its inset (240 - 10 - 12), which is exactly the height
   model.CardRects hit-tests against. Pinned to it by
   TestStylesheetMatchesModelGeometry. */
/* The inset is padding here, not margin.

   .evt gets its 10/12 inset from the shared margin rule above, but that does
   not work for this element: a stretched child is sized to the row's FULL
   height whatever its margins say, so the wrapper spanned the whole 240px band
   starting at y=40. Its rows then divided 240px instead of 218 and the last one
   was drawn over the weather chart below. Verified by filling the wrapper and
   measuring where the fill landed -- margin, height, and align-self all left it
   at 40..279, so none of them is what bounds this box.

   The stack is a column inside the row, and it hits gap #18b: a stretched child
   is offset by the row's inset and then sized to the row's FULL height, so the
   wrapper spanned the whole 240px band and its rows -- which divide the
   wrapper -- ran past the bottom onto the weather chart.

   The fix is to stop it stretching and state its height. align-self: flex-start
   is what makes the height apply at all; with the default stretch the height is
   ignored and the box is the full band. Both parts are required, and the
   combination is the ONE that works: padding on the wrapper, a zero-flex
   spacer, and a bare height each leave the rows at 0..239. Measured in an
   isolated probe -- padding+spacer put the rows at 0..239, height+margin at
   10..227, which is exactly the band's inset.

   218 is AgendaHeightPx less AgendaRowPadTop/Bot, the same arithmetic
   model.CardRects uses, and the values stay pinned by
   TestStylesheetMatchesModelGeometry. */
.evt-stack {
  flex-shrink: 0; position: relative;
  align-self: flex-start;
  height: 218px;
  display: flex; flex-direction: column; gap: 8px;
}
/* Each row's height is STATED, per row count, not divided by flex.

   flex: 1 1 0 is the correct way to split a parent's height and it is what this
   rule used to say -- but this engine sizes a flex child from its content and
   ignores the share, the same behaviour #clock-row and #wx-widget both work
   around by declaring a height. The rows therefore grew to fit their text and
   ran out of the wrapper, with the third row of a capped stack landing on the
   weather chart. */
.evt-stack .evt.stacked {
  min-height: 0; flex: 0 0 auto;
  /* Width comes from the wrapper, not from .evt.

     A stacked row is an .evt, so without this it keeps that rule's
     `width: 196px; flex-shrink: 0` whatever the slot is actually sized to. A
     current slot narrower than 196 -- a single event under ~33 minutes floors
     to AgendaMinCurW, 150px -- therefore rendered a 196px row inside a 150px
     box, overflowing 46px to the right and drawing under the next card. It
     reads as two conflicting events when nothing conflicts, which is exactly
     the thing the stack layout exists to communicate honestly.

     Observed on the panel at 13:02 on 2026-09-14: a 13:00-13:25 meeting
     overlapping the 13:30 card. The model was correct throughout (slot x=210
     w=150, next card x=374) -- this is purely the row overflowing its box, so
     no amount of reading the agenda arithmetic finds it.

     width:auto rather than 100%: the row is a flex child in a column, so auto
     already fills the cross axis, and 100% would be 100% of the content box
     and fight the padding. Pinned by TestStackedRowFitsNarrowSlot. */
  width: auto; align-self: stretch;
  /* Content sits at the top, not centred. justify-content: center spread the
     title and time to opposite ends of a row far taller than either needed,
     which read as a hole in the middle of every stacked card. */
  justify-content: flex-start;
  padding: 8px 14px;
  /* A stacked row is still an .evt, so it picks up the band inset from the
     shared margin rule above -- 22px per row, which is what pushed a two-row
     stack 44px past the band and put the third row of a capped stack on top of
     the weather chart. The wrapper already carries that inset for all of them,
     so the rows must not carry it again. */
  margin-top: 0; margin-bottom: 0;
}
/* Type for a stacked row: the base, refined per row count below.

   A stacked row must restate font-size. The cascade reaches it from .evt-title,
   but that is the 25px card size, which at two rows to a 218px band wraps an
   ordinary title onto two lines and pushes the time out of the box.

   (An earlier comment here claimed the .n2/.n3 forms below match nothing on this
   engine. That was wrong -- they work, and an isolated probe confirms all three
   descendant forms do. The bug being chased at the time was a malformed comment
   a few rules up, which the parser was discarding through.) */
.evt-stack .evt.stacked .evt-title {
  font-size: 19px; line-height: 1.15; -webkit-line-clamp: 2;
  margin-bottom: 2px;
}
.evt-stack .evt.stacked .evt-time { font-size: 17px; line-height: 1.2; }
/* Row heights. These are the band (218) less the 8px gaps, divided by the row
   count, and they MUST match the arithmetic in model.CardRects -- a row painted
   somewhere other than its rect is a tap that opens the neighbour's sheet.
   Pinned by TestStackRectsMatchTheRender. */
.evt-stack.n1 .evt.stacked { height: 218px; }
.evt-stack.n2 .evt.stacked { height: 105px; }
.evt-stack.n3 .evt.stacked { height: 67px; }
/* Repeat the current-card treatment: .evt.current's selector does not reach
   here through the stack wrapper, so the card would render unchromed. Scoped to
   a current stack -- unscoped, every future conflict painted itself in the
   in-progress blue and read as happening now. */
.evt-stack.current .evt.stacked {
  background: linear-gradient(160deg, rgba(74,144,217,0.24), rgba(74,144,217,0.07));
  border: 1px solid rgba(74,144,217,0.55);
  border-top-width: 3px;
}
.evt-stack.soon .evt.stacked {
  border-top-width: 3px;
  box-shadow: 0 0 0 1px rgba(245,158,11,0.3);
}

/* Type scale by row count. Three rows share the same 218px two do, so the third
   is bought out of the type: (218 - 2*8)/3 is ~67px a row, and once padding and
   a border come off there is room for one line of title and one of time, not
   two of either. The count arrives as a class from Go because this engine has
   neither :has() nor container queries, and a child combinator would parse and
   then be silently ignored.

   No fixed height on a title anywhere here. It used to be 56px, which reserved
   two lines whether or not the title needed them and left a visible hole above
   the time on every one-line card. The clamp bounds the tall case instead, and
   a short title now simply takes one line. */

/* Three rows get ~67px each. Minus 16px of padding and the 3px accent border
   that is ~46px of content: one line of title at 18px (21) and one of time at
   15px (18), which fits with 7px to spare. Two lines of either does not fit,
   hence the single-line clamp. */
.evt-stack.n3 .evt.stacked .evt-title {
  font-size: 18px; line-height: 1.15; -webkit-line-clamp: 1;
  margin-bottom: 1px;
}
.evt-stack.n3 .evt.stacked .evt-time { font-size: 15px; line-height: 1.2; }

/* The summary row stands for the events past the cap, so it is set as a note
   rather than as a card: no accent along the top, and the titles run to one
   line. Tapping it opens the sheet that lists them. */
.evt-stack .evt.stacked.overflow {
  background: rgba(255,255,255,0.03);
  border: 1px dashed var(--border);
  justify-content: center;
}
.evt-stack .evt.stacked.overflow .evt-title {
  font-size: 16px; font-weight: 500; line-height: 1.2;
  -webkit-line-clamp: 1; color: var(--text-mid);
}
/* Elapsed shade over the part of the slot already spent. No border: the single
   NOW bar is the only vertical line over it. */
.evt-elapsed {
  position: absolute; top: 0; bottom: 0; left: 0;
  background: rgba(7, 8, 13, 0.4);
  z-index: 3;
}

/* ---- Day separator (crossing into tomorrow) ---- */
.day-sep {
  flex-shrink: 0; align-self: stretch; display: flex; align-items: center;
  margin: 0 20px 0 6px; padding-left: 18px;
  border-left: 1px dashed rgba(255,255,255,0.12);
}
.day-sep span {
  font-family: 'Roboto', sans-serif;
  font-size: 20px; font-weight: 700; color: var(--text-mid);
  letter-spacing: 0.16em; text-transform: uppercase;
}

/* Free time between events reads as open space, not a card. */
.gap {
  width: 86px; flex-shrink: 0; align-self: stretch;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  border-radius: 10px; color: var(--green);
  background:
    repeating-linear-gradient(-45deg,
      rgba(106,210,138,0.07) 0 6px, transparent 6px 12px);
  border: 1px dashed rgba(106,210,138,0.28);
}
.gap-dur {
  font-family: 'Roboto', sans-serif;
  font-size: 22px; font-weight: 600;
}
/* The overnight chip carries no duration, so its single line is the whole
   label. "Overnight" is ~100px of ink at this size against an 86px chip, so it
   is set down the chip's long axis instead of across it -- the box is 240px
   tall and otherwise empty, and turning the word is what makes it fit without
   shrinking the type below the size the panel is read at.

   Stacked blocks rather than writing-mode, for the reason in #now-bar-label:
   text-align does not reach glyphs in a vertical writing-mode on this engine,
   so the letters would sit ragged. One block per letter keeps them centred. */
.gap-overnight {
  margin-top: 0;
  line-height: 1.05;
  text-align: center;
}
.gap-label {
  font-family: 'Roboto', sans-serif;
  font-size: 14px; font-weight: 700; margin-top: 4px;
  letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7;
}

.agenda-empty {
  font-family: 'Roboto', sans-serif;
  font-size: 26px; color: var(--text-dim);
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 90px 0 0 40px;
}

/* ---- Weather strip: curve + hour axis ---- */
#wx-zone {
  height: 128px; position: relative; flex-shrink: 0;
  border-top: 1px solid var(--border);
  background: linear-gradient(to bottom, rgba(10,14,28,0.75), rgba(7,8,13,0.9));
}
#wx-strip { height: 104px; }
/* NOTE: CSS does not cascade into inline <svg> children on this engine, so the
   curve's stroke and the temperature labels are emitted as presentation
   attributes by internal/chart. Only the <svg> box itself is styled here. */
.wx-chart { display: block; }
#wx-hours {
  height: 24px; position: relative;
  font-family: 'Roboto', sans-serif;
  font-size: 18px; color: var(--text-dim); letter-spacing: 0.05em;
}
.wx-hour { position: absolute; top: 0; padding-left: 3px; white-space: nowrap; }

/* ---- 7-day forecast ---- */
#forecast {
  /* 72px, not the reference's 58: hi-over-lo at 18px Plex Mono measures ~64px
     of content, and 58 clipped the low temperature. */
  height: 72px; flex-shrink: 0; display: flex; align-items: stretch;
  border-top: 1px solid var(--border); overflow: hidden;
}
/* gap is 14, not the reference's 10: its icons are emoji sitting in their own
   glyph bearing, while ours are SVGs that fill their box edge to edge -- at 10
   the sun's rays touched the "TODAY" label. */
.fc-col {
  flex: 1 1 0; display: flex; align-items: center; gap: 14px;
  padding: 0 16px; border-right: 1px solid rgba(255,255,255,0.04);
  min-width: 0;
}
.fc-dow {
  font-family: 'Roboto', sans-serif;
  font-size: 18px; font-weight: 600; color: var(--text-mid);
  text-transform: uppercase; letter-spacing: 0.04em;
  /* 58, not 42: "TODAY" is the longest label and measures 54px at this size
     (plus letter-spacing), so a 42px box let it run into the icon. */
  width: 58px; flex-shrink: 0;
}
.fc-icon { width: 40px; height: 40px; flex-shrink: 0; }
/* Hi over lo, not side by side. */
.fc-temps { display: flex; flex-direction: column; }
.fc-hi {
  font-family: 'Roboto', sans-serif;
  font-size: 18px; font-weight: 600; color: var(--text);
}
.fc-lo {
  font-family: 'Roboto', sans-serif;
  font-size: 18px; color: var(--text-mid);
}
.fc-pp {
  font-family: 'Roboto', sans-serif;
  font-size: 18px; font-weight: 600; color: var(--blue);
}
.fc-pp.none { color: var(--text-dim); }

/* ============================================================
   Modal sheet
   ============================================================

   A generic overlay: eyebrow, title, labelled rows, prose, actions. Event
   detail is the first thing to use it; forecast detail will supply different
   rows and reuse the shell untouched, so nothing here names an event.

   The sheet is anchored to x=380 -- the seam where #now-block ends and the
   agenda begins -- rather than centred. Three reasons, in order of weight:

     1. This panel is 1920x480, a 4:1 letterbox. A centred dialog on a 480px
        canvas either fills the screen or floats in a thin strip; a full-height
        sheet is the shape the display actually is.
     2. It occupies the region the user just tapped and leaves the clock,
        weather, and headline readable. The panel keeps doing its job while
        the sheet is open, which matters for a display on a wall.
     3. That seam is already in the design. Snapping to it reads as the agenda
        opening into its own space rather than as a foreign layer.

   Everything tappable is at least 64px tall. This is a fingertip on a wall,
   not a cursor. */

#dlg-scrim {
  position: absolute; left: 0; top: 0; width: 1920px; height: 480px;
  /* Dark enough to kill the agenda's card edges and gradient behind the
     sheet, while the left panel stays legible through it. */
  background: rgba(4,5,9,0.82);
  z-index: 40;
}

#dlg {
  position: absolute; left: 380px; top: 0; width: 1540px; height: 480px;
  z-index: 41;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02)),
    #0b0e17;
  border-left: 1px solid rgba(255,255,255,0.10);
  /* No padding and no flex column here. The sheet is position:absolute, and a
     padded absolutely-positioned flex column does not keep its children inside
     its own height in this engine -- the actions row fell off the bottom edge
     and the last detail rows were lost. The three bands below are pinned
     individually instead, which measured correct. Each band carries its own
     insets, so the rail never overlaps their text. */
  overflow: hidden;
}

/* The tapped card's own colour, carried into the sheet as a full-height rail.
   This is the single detail tying dialog to card: same colour that identifies
   the event in the row, at a scale you read from across the room. --accent is
   set per-dialog on the element. */
#dlg-rail {
  position: absolute; left: 0; top: 0; width: 4px; height: 480px;
  background: var(--accent);
}

#dlg-head {
  position: absolute; left: 44px; right: 40px; top: 20px;
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 32px;
}
#dlg-heading { flex: 1; min-width: 0; }

#dlg-eyebrow {
  font-family: 'Roboto', sans-serif;
  font-size: 17px; font-weight: 600; line-height: 1;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 7px;
}

/* Barlow Condensed at 54px: the title is the one thing read from a distance,
   and a condensed face buys room for a long meeting name before clamping.
   Two lines, then clip -- the sheet must not reflow its actions off-screen. */
#dlg-title {
  font-family: 'Roboto', sans-serif;
  font-size: 46px; font-weight: 700; line-height: 1.18;
  letter-spacing: 0.004em;
  color: var(--text);
  margin: 0;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Close sits top-right, where a dismiss control is looked for first. Sized as
   a real touch target rather than an icon: a 24px glyph is a mouse affordance
   and would be missed by a fingertip. */
.dlg-close {
  flex-shrink: 0;
  width: 150px; height: 60px;
  padding: 0;
  /* line-height centring, not flex: this engine drops a bare text child of a
     flex container entirely -- the button paints and its label vanishes. See
     docs/omnidoc-gaps.md. line-height matches height for a single line. */
  line-height: 60px; text-align: center;
  font-family: 'Roboto', sans-serif;
  font-size: 25px; font-weight: 600;
  letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--text-mid);
  background: none;
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 8px;
}

/* The body absorbs whatever the head and actions leave. Everything in the
   sheet is sized so five rows plus a three-line description fit in 480px --
   the panel does not scroll, so anything that does not fit is simply lost. */
/* Pinned between the head and the actions. top clears the tallest one-line
   head (eyebrow 17 + 7 + title 46) and bottom clears the actions band. */
#dlg-body {
  position: absolute; left: 44px; right: 40px; top: 112px; height: 270px;
  overflow: hidden;
}

/* The rows are the sheet's data. A two-column grid keeps every value on one
   left edge so the eye reads down the column rather than tracking ragged
   starts -- the labels are short and the values are what matter. */
/* One flex row per line, rather than a grid with display:contents rows --
   display:contents is unimplemented here and silently became a block, which
   collapsed every row onto its neighbour. A fixed label column gives the same
   aligned value edge a grid would. */
#dlg-rows { margin: 0; }
.dlg-row {
  display: flex; align-items: baseline; gap: 24px;
  margin-bottom: 7px;
}

.dlg-row-label {
  width: 132px; flex-shrink: 0;
  font-family: 'Roboto', sans-serif;
  font-size: 16px; font-weight: 600; line-height: 1.3;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-dim);
}
.dlg-row-value {
  margin: 0; flex: 1; min-width: 0;
  font-family: 'Roboto', sans-serif;
  font-size: 22px; font-weight: 500; line-height: 1.25;
  color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* Times and durations in the data face, so digits align down the column. */
.dlg-row-value.mono {
  font-family: 'Roboto', sans-serif;
  font-size: 21px; font-weight: 600;
  letter-spacing: 0.01em;
}

/* An event description. Quieter than the rows: it is context, not the answer
   to "what is this". Three lines is what the sheet can hold above the
   actions. */
#dlg-prose {
  margin: 12px 0 0;
  font-family: 'Roboto', sans-serif;
  font-size: 19px; line-height: 1.4;
  color: var(--text-mid);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Actions sit on the bottom edge, the far side of the sheet from the title --
   a deliberate distance, so the destructive-ish one is not adjacent to what
   the eye lands on first. */
/* top, not bottom: a bottom-anchored auto-height absolute box is positioned
   against a provisional height in this engine (it warns), which put the button
   half off the sheet's lower edge. The sheet is exactly 480px, so the top
   offset is arithmetic: 480 - 22 inset - 64 button = 394. */
#dlg-actions {
  position: absolute; left: 44px; top: 394px;
  display: flex; gap: 16px;
}
.dlg-btn {
  /* width, not min-width: a shrink-to-fit box does not grow around its text
     here, so a stated width is what keeps "Hide from panel" from clipping. */
  width: 300px; height: 64px;
  padding: 0;
  /* line-height centring -- see .dlg-close. */
  line-height: 64px; text-align: center;
  font-family: 'Roboto', sans-serif;
  font-size: 26px; font-weight: 600;
  letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--text);
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 10px;
}
/* The one action the sheet exists to offer. Amber is the panel's attention
   colour (the NOW cursor); using it here says "this is the control" without
   inventing a new hue for a one-button dialog. */
.dlg-btn.primary {
